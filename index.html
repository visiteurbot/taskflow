<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskFlow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b6cff'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6fb; --panel:#fff; --panel2:#f3f4fa; --line:#e6e8f3; --text:#1c2135; --muted:#7b829c;
  --accent:#5b6cff; --accent2:#8a5cff; --accent-soft:#eceeff; --on-accent:#fff;
  --high:#f0506e; --high-soft:#ffe9ee; --mid:#ff9f43; --mid-soft:#fff1e0; --low:#2fbf8f; --low-soft:#dff7ee;
  --shadow:0 1px 2px rgba(30,40,90,.05),0 6px 20px rgba(30,40,90,.07);
  --shadow-lg:0 20px 60px rgba(20,25,60,.28);
}
:root[data-theme=dark]{
  --bg:#0e1019; --panel:#171a27; --panel2:#1d2133; --line:#2a2f45; --text:#e8eaf5; --muted:#8c93b0;
  --accent:#7885ff; --accent2:#a283ff; --accent-soft:#242a52; --on-accent:#0e1019;
  --high:#ff6b86; --high-soft:#3b1f29; --mid:#ffb066; --mid-soft:#3b2d1d; --low:#4fd6a6; --low-soft:#183428;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3); --shadow-lg:0 20px 60px rgba(0,0,0,.65);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","Yu Gothic UI","Meiryo UI",system-ui,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}
svg{display:block}
.app{display:grid;grid-template-columns:216px 1fr;height:100vh}

/* sidebar */
.side{padding:22px 14px 16px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px;font-weight:800;font-size:19px;letter-spacing:.3px}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;box-shadow:0 6px 14px rgba(91,108,255,.4)}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;width:100%;text-align:left;color:var(--muted);font-weight:500;transition:.15s}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel);color:var(--accent);font-weight:700;box-shadow:var(--shadow)}
.nav svg{width:19px;height:19px;flex:none}
.nav .n{margin-left:auto;font-size:12px;font-variant-numeric:tabular-nums;background:var(--panel2);border-radius:99px;padding:0 8px;color:var(--muted)}
.nav.on .n{background:var(--accent-soft);color:var(--accent)}
.nav .n.red{background:var(--high);color:#fff}
.side-foot{margin-top:auto;display:flex;gap:6px;padding:12px 6px 0}
.ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);transition:.15s;font-size:15px}
.ib:hover{background:var(--panel);color:var(--text)}

/* main */
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{padding:20px 32px 6px}
.add{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;padding:5px 5px 5px 18px;border:2px solid transparent;transition:.15s}
.add:focus-within{border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft),var(--shadow)}
.add svg{width:20px;height:20px;color:var(--accent);flex:none}
.add input{flex:1;border:0;outline:0;background:none;font-size:15px;padding:11px 0;min-width:0}
.add input::placeholder{color:var(--muted)}
.add .sr{width:170px;padding:7px 10px;border-radius:10px;background:var(--panel2);font-size:13px;flex:none}
.btn{padding:10px 18px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;transition:.15s;box-shadow:0 4px 12px rgba(91,108,255,.35)}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:var(--panel2);color:var(--text);box-shadow:none;font-weight:600}
.btn.danger{background:var(--high-soft);color:var(--high);box-shadow:none}
.btn.sm{padding:6px 13px;font-size:13px;border-radius:10px}
.parse{display:flex;gap:6px;align-items:center;min-height:30px;padding:6px 6px 0;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.p3{background:var(--high-soft);color:var(--high)} .tag.p2{background:var(--mid-soft);color:var(--mid)} .tag.p1{background:var(--low-soft);color:var(--low)}
.content{flex:1;overflow:auto;padding:8px 32px 90px}
.wrap{max-width:900px;margin:0 auto}

/* header */
.head{display:flex;align-items:center;gap:20px;padding:6px 4px 22px}
.head h2{margin:0;font-size:30px;font-weight:800;letter-spacing:.3px}
.head .sub{margin-top:4px;color:var(--muted);font-weight:600;font-size:13px}
/* overview */
.ov{position:relative;overflow:hidden;color:#fff;border-radius:24px;padding:26px 30px 22px;margin-bottom:22px;
  background:radial-gradient(900px 300px at 100% -20%,rgba(138,92,255,.55),transparent 60%),radial-gradient(600px 260px at -10% 120%,rgba(79,107,237,.45),transparent 60%),linear-gradient(135deg,#0d1024 0%,#171b3d 55%,#232a6b 100%);
  box-shadow:0 18px 44px rgba(20,24,70,.35),inset 0 0 0 1px rgba(255,255,255,.07)}
.ov:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(180deg,#000,transparent 85%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%);pointer-events:none}
.ov>*{position:relative}
.ov-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:3px;color:#9aa8ff}
.ov-date{font-size:40px;font-weight:800;letter-spacing:.5px;line-height:1.15;margin-top:2px}
.ov-date small{font-size:15px;font-weight:600;color:rgba(255,255,255,.6);margin-left:12px;letter-spacing:.5px}
.ov-ring{position:relative;width:84px;height:84px;flex:none}
.ov-ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.ov-ring b small{font-size:11px;font-weight:700;opacity:.7;margin:6px 0 0 1px}
.ov-ring em{position:absolute;left:0;right:0;top:50px;text-align:center;font-style:normal;font-size:9.5px;letter-spacing:1px;color:rgba(255,255,255,.55)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.tile{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:13px 16px;backdrop-filter:blur(6px);transition:.15s}
.tile[data-act],.tile[data-nav]{cursor:pointer}
.tile[data-act]:hover,.tile[data-nav]:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
.tile b{display:block;font-size:32px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:rgba(255,255,255,.62);font-weight:600}
.tile.alert{background:rgba(240,80,110,.2);border-color:rgba(255,107,134,.45)}
.tile.alert b{color:#ff9db0}
.ov-bot{display:block}
.lh{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:700;color:rgba(255,255,255,.62);margin-bottom:8px}
.lh em{font-style:normal;color:#cfd6ff;font-variant-numeric:tabular-nums}
.lh em.hv{color:#ffd166}
.lbar{height:8px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.lbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#7885ff,#b79dff);transition:width .5s}
.lbar.hv i{background:linear-gradient(90deg,#ffb347,#ffd166)}
.hbars{display:flex;gap:7px;align-items:flex-end;height:54px}
.hb{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.hb i{width:100%;border-radius:5px 5px 2px 2px;background:rgba(255,255,255,.2)}
.hb.t i{background:linear-gradient(180deg,#b79dff,#7885ff)}
.hb span{font-size:10px;color:rgba(255,255,255,.5)}
.hb.t span{color:#fff;font-weight:800}
.more-d{margin-bottom:6px}.more-d summary{cursor:pointer;color:var(--muted);font-weight:700;font-size:12.5px;margin-bottom:12px;list-style:none}
.more-d summary:before{content:"＋ "}.more-d[open] summary:before{content:"－ "}

.warn{display:flex;align-items:center;gap:12px;background:var(--mid-soft);color:var(--text);border:1px solid var(--mid);border-radius:14px;padding:11px 16px;margin-bottom:16px}
.warn span{flex:1}

.fb{display:flex;flex-wrap:wrap;gap:14px 22px;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:14px 18px;margin-bottom:16px}
.fb label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px}
.fb .seg button{padding:5px 11px;font-size:13px;white-space:nowrap}
.fb select{padding:6px 10px;border-radius:10px;border:0;background:var(--panel2);outline:0}
.lk{display:inline-flex;gap:4px;align-items:center;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 9px;border-radius:99px;background:var(--panel2);color:var(--accent);font-weight:600;cursor:pointer}
.lk:hover{background:var(--accent-soft)}
.row.completing{opacity:0;transform:translateX(18px);transition:opacity .28s .1s,transform .28s .1s}
.row.completing .chk{background:var(--low);border-color:var(--low);opacity:1}
.row.completing .chk svg{opacity:1;transform:scale(1)}
.row.completing .t{text-decoration:line-through}
.pill.rp{background:var(--accent-soft);color:var(--accent);cursor:default}
.star{font-size:17px;line-height:1;color:var(--line);padding:2px 4px;border-radius:6px;opacity:0;transition:.15s}
.row:hover .star{opacity:1}.star:hover{color:#f5b301}.star.on{opacity:1;color:#f5b301}
.sh.imp{color:#e09b00}
.impbtn{width:100%;margin-top:10px;padding:8px 12px;border-radius:11px;background:var(--panel2);color:var(--muted);font-weight:700;text-align:left;transition:.15s;display:flex;flex-direction:column;gap:1px}
.impbtn small{font-size:10.5px;font-weight:500}
.impbtn.on{background:#fff4d6;color:#b07800;box-shadow:inset 0 0 0 1.5px #f5b301}
:root[data-theme=dark] .impbtn.on{background:#3b3115;color:#ffcf5c}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.lcard{position:relative;display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:14px;padding:12px 14px;cursor:pointer;box-shadow:0 1px 2px rgba(30,40,90,.04);transition:.15s}
.lcard:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.lic{width:38px;height:38px;border-radius:11px;color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.lt{min-width:0;flex:1}.lt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lt span{display:block;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lked{opacity:0;width:26px;height:26px;border-radius:8px;color:var(--muted);transition:.15s}
.lcard:hover .lked{opacity:1}.lked:hover{background:var(--panel2);color:var(--accent)}
.nav-h{margin:14px 12px 3px;font-size:10.5px;font-weight:800;letter-spacing:1.4px;color:var(--muted);opacity:.75}
.pill.pj{background:var(--pcs,var(--panel2));color:var(--pc,var(--muted));cursor:pointer}
.pill.mt{background:var(--mid-soft);color:var(--mid)}
.dt{font-size:11.5px;color:var(--muted)} .dt.ok{color:var(--low);font-weight:600}
.sh.pjh{color:var(--accent)}
.row.ms:before{border-radius:3px}
.pdot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}.pdot.big{width:16px;height:16px}
.muted{color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{background:var(--panel);border-radius:16px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);border-top:4px solid var(--pc);transition:.15s}
.pcard:hover{transform:translateY(-2px)}
.pc-h{display:flex;align-items:center;gap:8px}.pc-h b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pc-n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pc-bar{height:6px;background:var(--line);border-radius:9px;margin:10px 0 9px;overflow:hidden}.pc-bar i{display:block;height:100%;background:var(--pc);border-radius:9px}
.pc-next{font-size:12.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pc-next .od{color:var(--high)}
.pj-actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px 4px}
.pring{position:relative;margin-left:auto;width:64px;height:64px;flex:none}.pring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:800}
.arch{margin-left:10px;font-size:11px;background:var(--low-soft);color:var(--low);padding:1px 9px;border-radius:99px;vertical-align:middle}
.colors{display:flex;gap:8px}.cdot{width:26px;height:26px;border-radius:50%;border:3px solid transparent;transition:.15s}.cdot.on{border-color:var(--text)}
.tl{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px 10px;margin-bottom:22px;overflow:hidden}
.tl-row{display:grid;grid-template-columns:132px minmax(0,1fr);align-items:center}
.tl-name{display:flex;gap:8px;align-items:center;font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;padding-right:8px}
.tl-track{position:relative;height:40px;border-left:1px solid var(--line)}
.tl-track:before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:var(--panel2)}
.tl-axis .tl-track{height:22px;border:0}.tl-axis .tl-track:before{display:none}
.tl-axis span{position:absolute;top:2px;font-size:11px;color:var(--muted);font-weight:700;transform:translateX(3px)}
.tl-mline{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.tl-today{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--high);opacity:.75;z-index:1}
.mk{position:absolute;top:50%;width:15px;height:15px;margin:-7px 0 0 -7px;background:var(--pc);cursor:pointer;z-index:2;transition:.15s}
.mk.dia{transform:rotate(45deg) scale(.82);border-radius:3px}.mk.dia:hover{transform:rotate(45deg) scale(1.1)}
.mk.cir{border-radius:50%;background:var(--panel);border:3px solid var(--pc)}.mk.cir:hover{transform:scale(1.2)}
.mk.dn{opacity:.3}.mk.od{background:var(--high);box-shadow:0 0 0 3px var(--high-soft)}.mk.cir.od{border-color:var(--high);background:var(--panel)}
.tl-legend{display:flex;gap:16px;justify-content:flex-end;font-size:11px;color:var(--muted);padding:6px 4px 0}.tl-legend .red{color:var(--high)}
.ev.ms{font-weight:700;cursor:pointer}
.kp{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px 4px}
.wk-panel{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:22px}
.wtext{width:100%;min-height:360px;border:0;outline:0;background:var(--panel2);border-radius:12px;padding:14px 16px;line-height:1.8;resize:vertical;font-size:13.5px}
.mcap{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px;display:flex;gap:10px;align-items:flex-end;margin-bottom:14px}
.mcap textarea{flex:1;border:0;outline:0;background:none;resize:vertical;min-height:48px;font-size:14.5px;line-height:1.6}
.mtags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.mtags .pill{padding:2px 12px}
.mgrid{columns:3 230px;column-gap:12px}
.mcard{break-inside:avoid;position:relative;background:var(--panel);border-radius:14px;padding:13px 15px;margin-bottom:12px;box-shadow:0 1px 2px rgba(30,40,90,.05);cursor:pointer;transition:.15s}
.mcard:hover{box-shadow:var(--shadow)}.mcard.pin{box-shadow:inset 0 0 0 1.5px #f5b301,0 1px 2px rgba(30,40,90,.05)}
.mcard b{display:block;margin-bottom:3px;word-break:break-word;padding-right:62px}
.mcard p{margin:0;color:var(--muted);font-size:13px;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.mf2{display:flex;gap:6px;align-items:center;margin-top:9px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.macts{position:absolute;top:8px;right:8px;display:flex;gap:1px;opacity:0;transition:.15s}.mcard:hover .macts{opacity:1}
.macts button{width:22px;height:22px;border-radius:6px;font-size:12px;color:var(--muted)}.macts button:hover{background:var(--panel2);color:var(--accent)}
.dates{font-size:12px;color:var(--muted);margin-top:4px}.dates b{color:var(--text)}.dates input{padding:3px 8px;border-radius:8px;border:0;background:var(--panel2);font-size:12px;margin-left:4px}
.ck{display:flex!important;align-items:center;gap:8px;font-size:13px!important;color:var(--text)!important}.ck input{width:17px;height:17px;accent-color:var(--accent)}
.pj-block{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;border-top:4px solid var(--pc)}
.pj-bh{display:flex;align-items:center;gap:8px;padding:14px 18px 6px;cursor:pointer;flex-wrap:wrap}
.pj-bh b{font-size:16px;margin-right:6px}
.pst{font-size:12px;font-weight:700;background:var(--panel2);color:var(--muted);border-radius:99px;padding:1px 10px}.pst.red{background:var(--high-soft);color:var(--high)}
.pj-bh .go{margin-left:auto;font-size:12px;color:var(--muted)}
.pj-pb{height:5px;background:var(--line);border-radius:9px;margin:4px 18px 8px;overflow:hidden}.pj-pb i{display:block;height:100%;background:var(--pc);border-radius:9px}
.pj-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 24px;padding:2px 18px 14px}
.pj-col h5{margin:8px 0 4px;font-size:11.5px;color:var(--muted);letter-spacing:.4px}
.ci{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;cursor:pointer;font-size:13px}
.ci:hover{background:var(--panel2)}
.cd{flex:none;width:76px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.cd.od{color:var(--high);font-weight:700}.cd.soon{color:var(--mid);font-weight:700}
.ck2{flex:none;color:var(--pc);font-size:11px}
.ct{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cn{flex:none;font-size:11px;color:var(--muted)}.cn.od{color:var(--high)}.cn.soon{color:var(--mid)}
.ci.more{color:var(--accent);font-weight:600}.ci.none{color:var(--muted);cursor:default}.ci.none:hover{background:none}
.sugg2{background:var(--panel2);border:1.5px dashed var(--line);border-radius:16px;padding:14px 16px;margin:18px 0}
.hint2{font-size:11px;color:var(--muted);margin-top:8px}
@media (max-width:900px){.pj-cols{grid-template-columns:1fr}}
/* sections & rows */
.sec{margin-bottom:22px}
.sh{display:flex;align-items:center;gap:8px;margin:0 2px 9px;font-weight:700;font-size:13px;color:var(--muted)}
.sh .c{background:var(--panel);border-radius:99px;padding:0 8px;font-size:11px;box-shadow:var(--shadow)}
.sh.red{color:var(--high)} .sh .sp{flex:1} .sh button{font-size:12px;color:var(--muted);text-decoration:underline}
.sh .btn{color:#fff;font-size:13px;text-decoration:none;margin-left:6px}.sh .btn.ghost{color:var(--text)}
.row{position:relative;display:flex;align-items:center;gap:13px;background:var(--panel);border-radius:14px;padding:11px 14px 11px 18px;margin-bottom:7px;cursor:pointer;box-shadow:0 1px 2px rgba(30,40,90,.04);transition:.15s}
.row:before{content:"";position:absolute;left:6px;top:12px;bottom:12px;width:4px;border-radius:9px;background:var(--pc,var(--line))}
.row.p3{--pc:var(--high)} .row.p2{--pc:var(--mid)} .row.p1{--pc:var(--low)}
.row:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.row.done{opacity:.55} .row.done .t{text-decoration:line-through}

<script>
'use strict';
/* ===== utils ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parseD(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const diff = s => Math.round((parseD(s) - parseD(today())) / 864e5);
const WD = ['日','月','火','水','木','金','土'];
const PRI = {3:'高',2:'中',1:'低'};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const fmtMin = m => m >= 60 ? `${Math.floor(m/60)}時間${m%60 ? (m%60)+'分' : ''}` : `${m}分`;
const nextMonday = () => { const d = parseD(today()); d.setDate(d.getDate() + (8 - (d.getDay()||7))); return ymd(d); };

/* ===== state ===== */
const KEY = 'taskflow.v2';
let S = { tasks: [], nav: 'today', theme: 'light', calMonth: today().slice(0,7), hist: {}, cap: 360, showDone: false, links: [], projects: [], ms: [], memos: [], proj: '', pjShowDone: false, weekOff: 0, memoTag: '', f: {st:'open', imp:0, pri:0, proj:'', due:'all', tag:'', sort:'due', dir:1} };
let q = '';
const mk = o => Object.assign({id:uid(), title:'', note:'', due:'', plan:'', priority:2, important:false, project:'', tag:'', repeat:'', subs:[], links:[], done:false, doneAt:0, created:Date.now()}, o);
const byId = id => S.tasks.find(t => t.id === id);
function load(){
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
  if (!raw) { // v1 から移行
    try { const o = JSON.parse(localStorage.getItem('taskflow.v1')); if (o && o.tasks) raw = { tasks: o.tasks.map(t => mk({...t, done: t.status==='done', tag: t.cat||''})) , theme: o.theme==='dark'?'dark':'light' }; } catch(e){}
  }
  if (raw) Object.assign(S, raw);
  S.f = Object.assign({st:'open', imp:0, pri:0, proj:'', due:'all', tag:'', sort:'due', dir:1}, S.f);
  normalize();
  S.nav = 'today'; S.proj = '';
}
function normalize(){
  for (const k of ['tasks','links','projects','ms','memos']) if (!Array.isArray(S[k])) S[k] = [];
  S.tasks.forEach(t => { if (t.project == null) t.project = ''; if (!t.created) t.created = Date.now(); if (!Array.isArray(t.subs)) t.subs = []; if (!Array.isArray(t.links)) t.links = []; });
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* ===== derived ===== */
const open = () => S.tasks.filter(t => !t.done);
const imp = t => t.important ? 1 : 0;
const cmp = (a,b) => imp(b) - imp(a) || b.priority - a.priority || (a.due||'9').localeCompare(b.due||'9') || a.created - b.created;
const cmpDue = (a,b) => (a.due||'9').localeCompare(b.due||'9') || b.priority - a.priority || a.created - b.created;
function todayList(){ const T = today(); return open().filter(t => t.plan === T || t.important || (t.due && t.due <= T)); }
function streak(){
  let d = today(), n = 0;
  if (!(S.hist[d] > 0)) d = addDays(d,-1);
  while (S.hist[d] > 0) { n++; d = addDays(d,-1); }
  return n;
}


/* ===== projects / dates helpers ===== */
const PCOL = ['#5b6cff','#8a5cff','#e0559c','#f0506e','#ff9f43','#2fbf8f','#00a6b8','#4f8cff'];
const projById = id => S.projects.find(p => p.id === id);
const taskProj = t => {
  if (t.project && projById(t.project)) return t.project;
  const k = (t.tag || '').trim().toLowerCase(); if (!k) return '';
  const x = S.projects.find(y => y.name.trim().toLowerCase() === k); return x ? x.id : '';
};
const projOk = m => { const p = projById(m.project); return !!p && !p.archived; };
const msCmp = (a,b) => a.date.localeCompare(b.date) || (a.time||'').localeCompare(b.time||'');
const dayOf = ms => ymd(new Date(ms));
const mdT = ms => { const d = new Date(ms); return `${d.getMonth()+1}/${d.getDate()}`; };
const fmtMD = s => { const d = parseD(s); return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`; };
function weekRange(off){ const T = today(), d = parseD(T), dow = (d.getDay() + 6) % 7, mon = addDays(T, -dow + off*7); return {mon, sun: addDays(mon, 6)}; }
const firstLine = txt => (txt || '').split(/\r?\n/)[0].trim();
const memoTags = txt => [...new Set((txt || '').match(/#[^\s#]+/g) || [])].map(x => x.slice(1));

/* ===== links ===== */
const URL_RE = /^(?:https?|mailto|file|outlook|ms-outlook|onenote|msteams):/i;
const isUrl = v => URL_RE.test(v.trim());
const isPath = v => /^(?:[a-zA-Z]:[\\\/]|\\\\)/.test(v.trim());
const cleanLink = v => v.trim().replace(/^["“”]+|["“”]+$/g, '').trim();
function linkInfo(v){
  v = v.trim();
  if (isPath(v)) { const seg = v.replace(/[\\\/]+$/, '').split(/[\\\/]/).filter(Boolean).pop() || v; return {icon:'📁', label: seg.length > 24 ? seg.slice(0,24)+'…' : seg, url:true}; }
  if (/^mailto:/i.test(v)) return {icon:'✉️', label:decodeURIComponent(v.slice(7).split('?')[0]) || 'メール', url:true};
  if (/^https?:/i.test(v)) { try { const u = new URL(v); return {icon:'🔗', label:u.hostname.replace(/^www\./,'') + (u.pathname.length > 1 ? u.pathname.slice(0,18) : ''), url:true}; } catch(e){} }
  if (isUrl(v)) return {icon:/^(ms-)?outlook:/i.test(v) ? '✉️' : '🔗', label:v.replace(/^[a-z-]+:\/*/i,'').slice(0,24) || 'リンク', url:true};
  return {icon:'✉️', label:v.length > 26 ? v.slice(0,26)+'…' : v, url:false};
}
function copyText(v){
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(v);
  return new Promise((ok, ng) => { const x = document.createElement('textarea'); x.value = v; x.style.position = 'fixed'; x.style.opacity = '0'; document.body.appendChild(x); x.select(); let r = false; try { r = document.execCommand('copy'); } catch(e){} x.remove(); r ? ok() : ng(); });
}
function openLink(v){
  v = cleanLink(v);
  if (isPath(v)) {
    copyText(v).catch(() => {});
    const a = document.createElement('a'); a.href = 'taskflow-open:' + encodeURIComponent(v); document.body.appendChild(a); a.click(); a.remove();
    toast('フォルダ／ファイルを開いています…（開かないときはパスをコピー済みなので、エクスプローラーに貼り付けてください）');
  }
  else if (isUrl(v)) { const a = document.createElement('a'); a.href = v; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }
  else { copyText(v).then(() => toast('コピーしました（貼り付けて使えます）'), () => toast('コピーできませんでした')); }
}

const REP = {daily:'毎日', weekday:'平日', weekly:'毎週', monthly:'毎月'};
function nextDow(k, includeToday){ const d = parseD(today()); let n = (k - d.getDay() + 7) % 7; if (n === 0 && !includeToday) n = 7; d.setDate(d.getDate() + n); return ymd(d); }
function nextDom(day){ const n = parseD(today()); let d = new Date(n.getFullYear(), n.getMonth(), day); if (d < n) d = new Date(n.getFullYear(), n.getMonth()+1, day); return d; }
function nextWeekday(){ const d = parseD(today()); while ([0,6].includes(d.getDay())) d.setDate(d.getDate()+1); return ymd(d); }

/* ===== quick-add parsing ===== */
function parseQuick(text){
  let title = text, due = '', priority = 0, tag = '', important = false, repeat = '', project = ''; const links = [];
  const T = today();
  const take = (re, fn) => { const m = title.match(re); if (m) { fn(m); title = title.replace(m[0], ' '); } };
  for (let g = 0; g < 5; g++) take(/(?:https?|mailto|file|ms-outlook|outlook|onenote|msteams):\S+/i, m => links.push(m[0]));
  { const m = title.match(/(?:^|\s)@(\S+)/); if (m) { const k = m[1].toLowerCase(); const pj = S.projects.find(x => x.name.toLowerCase() === k) || S.projects.find(x => x.name.toLowerCase().includes(k)); if (pj) { project = pj.id; title = title.replace(m[0], ' '); } } }
  take(/(?:^|\s)(?:[!！]重要|★)/, () => important = true);
  take(/(?:^|\s)#(\S+)/, m => tag = m[1]);
  take(/(?:^|\s)[!！](高|中|低|[1-3])/, m => priority = {高:3,中:2,低:1}[m[1]] || +m[1]);
  take(/毎平日|平日毎日|毎営業日/, () => { repeat = 'weekday'; due = nextWeekday(); });
  take(/毎日/, () => { repeat = 'daily'; due = T; });
  take(/毎週(?:([日月火水木金土])曜(?:日)?)?/, m => { repeat = 'weekly'; due = m[1] ? nextDow(WD.indexOf(m[1]), true) : T; });
  take(/毎月(?:(\d{1,2})日)?/, m => { repeat = 'monthly'; const n = new Date(); due = m[1] ? ymd(nextDom(+m[1])) : T; });
  take(/明後日|あさって/, () => due = addDays(T,2));
  take(/明日|あした/, () => due = addDays(T,1));
  take(/今日|きょう|本日/, () => due = T);
  take(/来週/, () => due = nextMonday());
  take(/([日月火水木金土])曜(?:日)?/, m => { const d = parseD(T); let k = (WD.indexOf(m[1]) - d.getDay() + 7) % 7 || 7; d.setDate(d.getDate()+k); due = ymd(d); });
  take(/(\d{1,2})[\/月](\d{1,2})日?/, m => { const now = parseD(T); const d = new Date(now.getFullYear(), +m[1]-1, +m[2]); if (d < now) d.setFullYear(d.getFullYear()+1); due = ymd(d); });
  take(/(\d{1,3})日後/, m => due = addDays(T, +m[1]));
  return { title: title.replace(/\s+/g,' ').trim(), due, priority: priority || 2, hasPri: !!priority, tag, important, links, repeat, project };
}
function dueInfo(due){
  const n = diff(due), d = parseD(due), full = `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`;
  if (n < 0) return {t:`${-n}日超過`, c:'over', full};
  if (n === 0) return {t:'今日', c:'today', full};
  if (n === 1) return {t:'明日', c:'soon', full};
  return {t: full, c: n <= 3 ? 'soon' : '', full};
}

/* ===== mutations ===== */
function undoable(msg, fn){
  const snap = JSON.stringify({tasks:S.tasks, hist:S.hist});
  fn(); save(); render();
  toast(msg, '元に戻す', () => { const o = JSON.parse(snap); S.tasks = o.tasks; S.hist = o.hist; save(); render(); });
}
function addTask(o){ const t = mk(o); S.tasks.unshift(t); save(); render(); return t; }
function complete(t){
  const T = today();
  t.done = true; t.doneAt = Date.now(); S.hist[T] = (S.hist[T]||0) + 1;
  if (t.repeat) {
    const base = t.due || T, d = parseD(base);
    let guard = 0;
    do {
      if (t.repeat === 'daily') d.setDate(d.getDate()+1);
      else if (t.repeat === 'weekday') { do d.setDate(d.getDate()+1); while ([0,6].includes(d.getDay())); }
      else if (t.repeat === 'weekly') d.setDate(d.getDate()+7);
      else if (t.repeat === 'monthly') d.setMonth(d.getMonth()+1);
    } while (ymd(d) <= T && ++guard < 400);
    S.tasks.unshift(mk({...t, id:uid(), due:ymd(d), plan:'', done:false, doneAt:0, created:Date.now(), subs:t.subs.map(s=>({...s,d:false}))}));
  }
}
function toggle(id, silent){
  const t = byId(id); if (!t) return;
  if (t.done) {
    const k = ymd(new Date(t.doneAt || Date.now()));
    t.done = false; t.doneAt = 0; if (S.hist[k] > 0) S.hist[k]--;
    save(); render(); return;
  }
  const before = todayList().length;
  complete(t); save();
  const el = document.querySelector(`.row[data-open="${id}"]`);
  if (el) el.classList.add('completing');
  setTimeout(render, el ? 380 : 0);
  toast(before > 0 && todayList().length === 0 ? '今日のタスクをすべて完了しました' : '完了しました', '元に戻す', () => toggle(id));
}
function resched(id, kind){
  const t = byId(id); if (!t) return;
  const T = today();
  undoable(({today:'今日にしました', tomorrow:'明日に回しました', nextweek:'来週に回しました', plan:'今日やることに追加しました', unplan:'今日やることから外しました'})[kind], () => {
    if (kind === 'today') { if (t.due && t.due < T) t.due = T; else t.plan = T; }
    else if (kind === 'plan') t.plan = T;
    else if (kind === 'unplan') t.plan = '';
    else if (kind === 'tomorrow') { t.due = addDays(T,1); t.plan = ''; }
    else if (kind === 'nextweek') { t.due = nextMonday(); t.plan = ''; }
  });
}
function delTask(id){ const i = S.tasks.findIndex(t => t.id === id); if (i<0) return; const [t] = S.tasks.splice(i,1); save(); render(); toast('削除しました','元に戻す',()=>{S.tasks.splice(i,0,t);save();render();}); }

/* ===== weekly report ===== */
function weekData(off){
  const {mon, sun} = weekRange(off), nmon = addDays(mon,7), nsun = addDays(mon,13), inW = x => x >= mon && x <= sun;
  const done = S.tasks.filter(t => t.done && t.doneAt && inW(dayOf(t.doneAt))).sort((a,b) => a.doneAt - b.doneAt);
  const created = S.tasks.filter(t => inW(dayOf(t.created)));
  const msW = S.ms.filter(m => projOk(m) && inW(m.date)).sort(msCmp);
  const nextT = open().filter(t => t.due && t.due >= nmon && t.due <= nsun).sort(cmpDue);
  const nextM = S.ms.filter(m => !m.done && projOk(m) && m.date >= nmon && m.date <= nsun).sort(msCmp);
  const carry = open().filter(t => t.due && t.due <= sun).sort(cmpDue);
  return {mon, sun, nmon, nsun, done, created, msW, nextT, nextM, carry};
}
function weekText(off){
  const W = weekData(off), f = s => s.replace(/-/g, '/');
  const pn = t => (projById(taskProj(t)) || {}).name || '個人・その他';
  const L = [`週報　${f(W.mon)}（月）〜 ${f(W.sun).slice(5)}（日）`, ''];
  L.push(`■ 今週の実施内容（完了 ${W.done.length}件）`);
  if (!W.done.length) L.push('・なし');
  const g = {}; W.done.forEach(t => (g[pn(t)] ||= []).push(t));
  [...S.projects.map(x => x.name), '個人・その他'].filter(n => g[n]).forEach(n => { L.push(`【${n}】`); g[n].forEach(t => L.push(`・${t.title}（${mdT(t.doneAt)}）`)); });
  L.push('', '■ 会議・マイルストン');
  if (!W.msW.length) L.push('・なし');

/* ===== link collection ===== */
const LKC = ['#5b6cff','#8a5cff','#e0559c','#f0506e','#ff9f43','#2fbf8f','#00a6b8','#4f8cff'];
const lkColor = str => { let h = 0; for (const c of str) h = (h*31 + c.charCodeAt(0)) >>> 0; return LKC[h % LKC.length]; };
function lkSub(u){
  try { if (/^https?:/i.test(u)) { const x = new URL(u); return x.hostname.replace(/^www\./,'') + (x.pathname.length > 1 ? x.pathname.slice(0,24) : ''); } } catch(e){}
  if (isPath(u)) return u.length > 36 ? '…' + u.slice(-35) : u;
  return isUrl(u) ? u.replace(/^[a-z-]+:\/*/i,'').slice(0,34) : (u.length > 34 ? u.slice(0,34)+'…' : u) + '（クリックでコピー）';
}
function vLinks(){
  const k = q.toLowerCase(), all = (S.links || []).filter(l => !k || (l.title + l.url + l.group).toLowerCase().includes(k));

  return `<div class="head" style="padding-bottom:16px"><div><h2>リンク集</h2><div class="sub">${(S.links||[]).length} 件　クリックですぐ開きます</div></div><button class="btn" data-lkadd="1" style="margin-left:auto">＋ リンクを追加</button></div>` +
    (keys.length ? keys.map(g => `<div class="sec"><div class="sh">${esc(g || 'その他')}<span class="c">${groups[g].length}</span></div><div class="lgrid">${groups[g].map(card).join('')}</div></div>`).join('')
      : `<div class="empty"><b>${k ? '見つかりませんでした' : 'よく使うリンクを登録しましょう'}</b>${k ? '' : '社内サイト、システム、フォルダ、資料など、毎日開くものを入れておくと便利です'}</div>`);

function renderParse(){
  const v = qa.value.trim();
  if (!v) { $('#parse').innerHTML = '<span>書き方：</span><span class="tag">今日 / 明日 / 金曜 / 10/25</span><span class="tag">!重要</span><span class="tag">!高 !中 !低</span><span class="tag">#タグ</span><span class="tag">毎日 / 毎週月曜 / 毎月25日</span><span class="tag">@プロジェクト名</span><span>日付なしは「あとで」に入ります</span>'; return; }
  const r = parseQuick(v);
  $('#parse').innerHTML = '<span>→</span>' + (r.due ? `<span class="tag">📅 ${dueInfo(r.due).full}</span>` : '<span class="tag">📥 あとで</span>') + (r.important ? '<span class="tag p3">★ 重要</span>' : '') + (r.hasPri ? `<span class="tag p${r.priority}">優先度 ${PRI[r.priority]}</span>` : '') + (r.tag ? `<span class="tag">#${esc(r.tag)}</span>` : '') + (r.links.length ? `<span class="tag">🔗 リンク${r.links.length}件</span>` : '') + (r.repeat ? `<span class="tag">🔁 ${REP[r.repeat]}</span>` : '') + (r.project || taskProj({tag: r.tag}) ? `<span class="tag">📁 ${esc(projById(r.project || taskProj({tag: r.tag})).name)}</span>` : (S.nav === 'projects' && projById(S.proj) ? `<span class="tag">📁 ${esc(projById(S.proj).name)}</span>` : ''));
}
function submitQuick(detail){
  const r = parseQuick(qa.value); if (!r.title && !r.links.length && !detail) return;
  if (!r.title && r.links.length) r.title = linkInfo(r.links[0]).label;
  qa.value = ''; renderParse();
  const o = {title:r.title, due:r.due, priority:r.priority, important:r.important, tag:r.tag, links:r.links, repeat:r.repeat, project: r.project || (S.nav === 'projects' && projById(S.proj) ? S.proj : '')};
  if (detail) return openModal(null, o);
  addTask(o); toast(r.due ? `追加しました（${dueInfo(r.due).full}）` : '「あとで」に追加しました'); qa.focus();
}
qa.addEventListener('input', renderParse);
qa.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submitQuick(e.ctrlKey); } });
$('#qb').onclick = () => submitQuick(false); $('#qd').onclick = () => submitQuick(true);
$('#q').addEventListener('input', e => { q = e.target.value.trim(); render(); });
document.addEventListener('keydown', e => {
  if (e.target.id === 'memoIn' && (e.ctrlKey||e.metaKey) && e.key === 'Enter') { e.preventDefault(); if (addMemo(e.target.value)) toast('メモを保存しました'); return; }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); $('#q').focus(); return; }
  if (e.key === 'Escape') { document.activeElement.blur(); if (q) { q = ''; $('#q').value = ''; render(); } return; }
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || $('#layer').firstChild) return;
  if (e.key === '/') { e.preventDefault(); qa.focus(); }
  else if (e.key.toLowerCase() === 'n') { e.preventDefault(); openModal(); }
  else if ('123456789'.includes(e.key) && e.key) { S.nav = ['today','soon','all','cal','inbox','week','projects','memo','links'][+e.key-1]; q = ''; $('#q').value = ''; render(); }
});

function exportData(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({app:'taskflow', version:3, data:S}, null, 2)], {type:'application/json'}));
  a.download = `taskflow-backup-${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast('バックアップを書き出しました');
}
const fileIn = Object.assign(document.createElement('input'), {type:'file', accept:'.json', hidden:true}); document.body.appendChild(fileIn);
fileIn.onchange = () => { const f = fileIn.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result).data; if (!Array.isArray(d.tasks)) throw 0; if (!confirm(`${d.tasks.length}件のタスクを読み込みます。現在のデータは置き換わります。`)) return; S.links = []; S.projects = []; S.ms = []; S.memos = []; S.hist = {}; S = Object.assign(S, d); S.f = Object.assign({st:'open', imp:0, pri:0, proj:'', due:'all', tag:'', sort:'due', dir:1}, S.f); normalize(); S.proj = ''; save(); render(); toast('読み込みました'); } catch(e){ toast('読み込めないファイルです'); } fileIn.value = ''; }; r.readAsText(f); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

load(); renderParse(); render();
</script>
</body>
</html>
